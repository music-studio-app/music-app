<script>
/* Music App V4.1 PRO — Bağlama Karar Sesi ve Oktav */

(function () {
  const names = [
    "Do", "Do♯", "Re", "Re♯", "Mi", "Fa",
    "Fa♯", "Sol", "Sol♯", "La", "La♯", "Si"
  ];

  const instruments = ["short", "long", "divan"];
  const instrumentSelect = document.getElementById("tunerInstrument");
  const tuningSelect = document.getElementById("tunerTuning");
  const notesContainer = document.getElementById("tunerNotes");

  if (!instrumentSelect || !tuningSelect || !notesContainer) return;

  const storageKey = "musicapp_tuner_decision_v41";

  let saved = {};
  try {
    saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
  } catch {}

  const panel = document.createElement("div");
  panel.className = "card";
  panel.id = "decisionPanel";

  panel.innerHTML = `
    <h3>🎼 Bağlama Karar Sesi</h3>
    <p>Karar sesini ve oktavı seç. Tel notaları otomatik güncellensin.</p>

    <label for="decisionNote">Karar sesi</label>
    <select id="decisionNote" class="field"></select>

    <label for="decisionOctave">Oktav</label>
    <select id="decisionOctave" class="field">
      <option value="-1">Bir oktav pes</option>
      <option value="0">Normal oktav</option>
      <option value="1">Bir oktav tiz</option>
    </select>
  `;

  tuningSelect.parentElement.insertAdjacentElement("afterend", panel);

  const decisionNote = document.getElementById("decisionNote");
  const decisionOctave = document.getElementById("decisionOctave");

  decisionNote.innerHTML = names.map((name, index) =>
    `<option value="${index}">${name}</option>`
  ).join("");

  decisionNote.value = saved.note ?? "9";
  decisionOctave.value = saved.octave ?? "0";

  function updateVisibility() {
    panel.style.display = instruments.includes(instrumentSelect.value)
      ? ""
      : "none";
  }

  function applyDecision() {
    updateVisibility();

    if (!instruments.includes(instrumentSelect.value)) return;

    const shift =
      Number(decisionNote.value) - 9 +
      Number(decisionOctave.value) * 12;

    const a4Input = document.getElementById("tunerA4");
    const a4 = Number(a4Input?.value) || 440;

    const buttons = notesContainer.querySelectorAll("button");

    buttons.forEach(button => {
      if (!button.dataset.originalText) {
        button.dataset.originalText = button.textContent.trim();
      }

      const strong = button.querySelector("strong");
      const small = button.querySelector("small");

      if (!strong || !small) return;

      const match = button.dataset.originalText.match(
        /(Do|Re|Mi|Fa|Sol|La|Si)[♯#]?\d/
      );

      if (!match) return;

      const original = match[0];
      const parsed = original.match(
        /^(Do|Re|Mi|Fa|Sol|La|Si)([♯#]?)(\d)$/
      );

      if (!parsed) return;

      const baseIndex = names.indexOf(
        parsed[1] + (parsed[2] ? "♯" : "")
      );

      if (baseIndex < 0) return;

      const originalMidi =
        (Number(parsed[3]) + 1) * 12 + baseIndex;

      const midi = originalMidi + shift;
      const noteName =
        names[((midi % 12) + 12) % 12] +
        (Math.floor(midi / 12) - 1);

      const hz = a4 * Math.pow(2, (midi - 69) / 12);

      strong.textContent =
        button.dataset.originalText
          .replace(original, noteName)
          .replace(/\s+\d+([.,]\d+)?\s*Hz.*/i, "");

      small.textContent = hz.toFixed(2) + " Hz";
    });

    localStorage.setItem(storageKey, JSON.stringify({
      note: decisionNote.value,
      octave: decisionOctave.value
    }));
  }

  decisionNote.addEventListener("change", applyDecision);
  decisionOctave.addEventListener("change", applyDecision);

  instrumentSelect.addEventListener("change", () => {
    setTimeout(applyDecision, 50);
  });

  tuningSelect.addEventListener("change", () => {
    setTimeout(applyDecision, 50);
  });

  updateVisibility();
  setTimeout(applyDecision, 100);
})();
</script>
