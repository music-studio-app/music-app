name: Turkulerin sozlerini arşive aktar
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vikikaynak turku sayfalarini oku
        run: python scripts/aktar.py
      - name: Katalog ve raporu kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/sarki-sozleri.json catalog/aktarim-raporu.json
          git diff --cached --quiet || (git commit -m "Türkü sözleri kaynak aktarımı (inceleme bekliyor)" && git push)
